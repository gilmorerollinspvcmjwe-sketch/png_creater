id: cyberpunk-style
name: 赛博朋克风格包
version: 1.0.0
description: 酷炫的赛博朋克科技风，霓虹配色和电子元素

triggers:
  keywords:
    - 赛博
    - 朋克
    - 科技
    - 霓虹
    - 酷炫
    - 电音
    - 未来
  mbti:
    - INTJ
    - ENTP
    - INTP
    - ENTJ

colors:
  primary: "#4A90D9"
  secondary: "#1A1A2A"
  accent: "#00D4FF"
  text: "#FFFFFF"
  background: "#0D0D1A"

fonts:
  heading: "Orbitron"
  body: "Noto Sans SC"
  accent: "Share Tech Mono"

effects:
  - type: glow
    config:
      color: "#00D4FF"
      intensity: medium
  - type: scanlines
    config:
      opacity: 0.1
  - type: background
    config:
      gradient: "linear-gradient(180deg, #0D0D1A 0%, #1A1A2A 100%)"

constraints:
  min_components: 4
  max_components: 10
  background_must_be_dark: true
  avoid_light_colors: true

# Tier 3: 扩展 Skill 能力
required_components:
  - hero-section
  - glitch-text
  - attribute-wall

recommended_components:
  - music-player
  - social-links
  - tag-group

component_rules:
  quote:
    style: "typewriter"
    animation: "glitch"
  hero-section:
    decoration: "circuit-lines"
    animation: "glitch"
  attribute-wall:
    style: "neon-border"
    animation: "scan"

prompt_suffix: |
  请使用霓虹色彩和科技元素，营造赛博朋克的酷炫氛围。
  深色背景配合发光效果，字体使用科技感强的风格。
  可以添加扫描线和故障效果。