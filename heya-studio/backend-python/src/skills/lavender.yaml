id: lavender-style
name: 薰衣草优雅风格包
version: 1.0.0
description: 温柔优雅的薰衣草紫色系，适合文艺气质爱好者

triggers:
  keywords:
    - 薰衣草
    - 紫色
    - 优雅
    - 文艺
    - 梦幻
    - 浪漫
  mbti:
    - INFJ
    - INFP
    - ENFJ
    - ISFP

colors:
  primary: "#B8A9C9"
  secondary: "#E6E0F0"
  accent: "#D4C5E0"
  text: "#2A2A2A"
  background: "#F5F0FA"

fonts:
  heading: "Noto Serif SC"
  body: "Noto Sans SC"
  accent: "ZCOOL QingKe HuangYou"

effects:
  - type: particles
    config:
      shape: sparkle
      count: 20
      speed: slow
  - type: background
    config:
      gradient: "linear-gradient(135deg, #F5F0FA 0%, #E6E0F0 50%, #D4C5E0 100%)"

constraints:
  min_components: 3
  max_components: 8
  background_must_be_light: true
  avoid_dark_colors: true

# Tier 3: 扩展 Skill 能力
required_components:
  - hero-section
  - quote

recommended_components:
  - tag-group
  - social-links
  - music-player

component_rules:
  quote:
    style: "serif-italic"
    animation: "fade-in"
  hero-section:
    decoration: "sparkles"
    animation: "gentle-float"
  tag-group:
    shape: "pill"

prompt_suffix: |
  风格指导：薰衣草风格的主页应该体现优雅文艺的氛围，
  文案使用紫色系词汇，营造梦幻浪漫的感觉。
  字体偏好衬线体，整体风格柔和、知性。
