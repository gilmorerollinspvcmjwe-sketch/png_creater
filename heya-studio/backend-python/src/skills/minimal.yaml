id: minimal-style
name: 极简主义风格包
version: 1.0.0
description: 简洁克制的极简风格，留白与排版的艺术

triggers:
  keywords:
    - 极简
    - 简约
    - 简洁
    - 黑白
    - 留白
    - minimal
  mbti:
    - INTJ
    - ISTJ
    - INTP
    - ISTP

colors:
  primary: "#333333"
  secondary: "#F5F5F5"
  accent: "#888888"
  text: "#1A1A1A"
  background: "#FFFFFF"

fonts:
  heading: "Noto Sans SC"
  body: "Noto Sans SC"
  accent: "Source Code Pro"

effects:
  - type: background
    config:
      gradient: "none"
      color: "#FFFFFF"

constraints:
  min_components: 3
  max_components: 6
  background_must_be_light: true
  avoid_decorative_effects: true

# Tier 3: 扩展 Skill 能力
required_components:
  - hero-section
  - quote

recommended_components:
  - attribute-wall
  - social-links

component_rules:
  quote:
    style: "sans-serif"
    animation: "none"
  hero-section:
    decoration: "none"
    animation: "fade-in"
  attribute-wall:
    style: "clean-grid"
    border: "thin"

prompt_suffix: |
  风格指导：极简风格的主页应该体现克制和留白的美学，
  避免过多装饰元素和花哨效果，以排版和内容为核心。
  颜色使用黑白灰，最多一个强调色，字体使用无衬线体。
