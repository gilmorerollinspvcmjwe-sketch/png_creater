id: mint-style
name: 薄荷清新风格包
version: 1.0.0
description: 清新自然的薄荷绿色系，适合清爽活力爱好者

triggers:
  keywords:
    - 薄荷
    - 清新
    - 绿色
    - 自然
    - 清爽
    - 森系
  mbti:
    - ENFP
    - ESFP
    - ISFJ
    - ESFJ

colors:
  primary: "#98D4BB"
  secondary: "#E0F5E8"
  accent: "#C4E4D0"
  text: "#2A2A2A"
  background: "#F5FAF8"

fonts:
  heading: "Noto Sans SC"
  body: "Noto Sans SC"
  accent: "ZCOOL KuaiLe"

effects:
  - type: particles
    config:
      shape: leaf
      count: 15
      speed: slow
  - type: background
    config:
      gradient: "linear-gradient(180deg, #F5FAF8 0%, #E0F5E8 100%)"

constraints:
  min_components: 3
  max_components: 8
  background_must_be_light: true
  avoid_dark_colors: true

# Tier 3: 扩展 Skill 能力
required_components:
  - hero-section
  - tag-group

recommended_components:
  - quote
  - social-links
  - music-player

component_rules:
  quote:
    style: "handwriting"
    animation: "slide-up"
  hero-section:
    decoration: "leaves"
    animation: "bounce-in"
  tag-group:
    shape: "rounded"
    color: "gradient-green"

prompt_suffix: |
  风格指导：薄荷风格的主页应该体现清新自然的氛围，
  文案使用绿色系和自然元素词汇，营造活力清爽的感觉。
  整体风格清新、明亮，适合展示生活和爱好。
